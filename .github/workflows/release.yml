name: Release debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same matrix as ci.yml; publication waits for every leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: "36"
            instrumentation-args: ""
          - api-level: "37.0"
            instrumentation-args: ""
          - api-level: "26"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.package=wallcrawl.elopenmike.com.app"

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same as ci.yml: an AVD for a dotted API level such as 37.0 needs newer
      # command-line tools than the runner preinstalls.
      # https://github.com/ReactiveCircus/android-emulator-runner/issues/482 (open fix: #494)
      - name: Update Android command-line tools
        if: contains(matrix.api-level, '.')
        run: |
          sdk="${ANDROID_HOME:?}"
          # Accepting licenses first keeps the install outside a `yes` pipeline, so its exit
          # status is checked even under pipefail.
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;23.0"
          rm -rf "$sdk/cmdline-tools/latest"
          mv "$sdk/cmdline-tools/23.0" "$sdk/cmdline-tools/latest"
          grep -qx 'Pkg.Revision=23.0' "$sdk/cmdline-tools/latest/source.properties"

      # Tag publication is gated on the same real Room migration and runtime schema
      # validation that protects pull requests and main. A JVM-only release build cannot
      # prove that an installed database survives the complete schema-10 chain.
      # AGP's connected-test runner can log an APK install failure and still exit 0
      # without a report, so a leg passes only if its report recorded at least one test.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          INSTRUMENTATION_ARGS: ${{ matrix.instrumentation-args }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest $INSTRUMENTATION_ARGS --stacktrace --no-daemon
            grep -q 'tests="[1-9]' app/build/outputs/androidTest-results/connected/debug/TEST-*.xml

      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-instrumentation-report-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7

  release:
    name: Validate and publish prerelease
    needs: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Run release tooling tests
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Derive release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/validate_version.py \
            --tag "$TAG_NAME" \
            --run-number "$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run tests, lint, and debug build
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew test lint assembleDebug \
            "-Pwallcrawl.versionCode=$VERSION_CODE" \
            "-Pwallcrawl.versionName=$VERSION_NAME" \
            --stacktrace \
            --no-daemon

      - name: Validate release version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/validate_version.py \
            --tag "$TAG_NAME" \
            --run-number "$RUN_NUMBER" \
            --metadata app/build/outputs/apk/debug/output-metadata.json

      - name: Stage release asset
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "Expected non-empty APK not found: $source_apk" >&2
            exit 1
          fi

          asset_path="wallcrawl-${TAG_NAME}-debug.apk"
          cp "$source_apk" "$asset_path"
          printf 'ASSET_PATH=%s\n' "$asset_path" >> "$GITHUB_ENV"

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          > [!WARNING]
          > This is an early debug build. Uninstall any previous CI-distributed
          > WallCrawl build before installing this APK. Uninstalling removes the
          > app's local data.
          EOF

          gh release create "$TAG_NAME" \
            "$ASSET_PATH#WallCrawl ${TAG_NAME} debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WallCrawl ${TAG_NAME}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "$notes_file"
