name: Release debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrumentation:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Tag publication is gated on the same real Room migration and runtime schema
      # validation that protects pull requests and main. A JVM-only release build cannot
      # prove that an installed database survives the complete schema-10 chain.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-instrumentation-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7

  release:
    name: Validate and publish prerelease
    needs: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Run release tooling tests
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Derive release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/validate_version.py \
            --tag "$TAG_NAME" \
            --run-number "$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run tests, lint, and debug build
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew test lint assembleDebug \
            "-Pwallcrawl.versionCode=$VERSION_CODE" \
            "-Pwallcrawl.versionName=$VERSION_NAME" \
            --stacktrace \
            --no-daemon

      - name: Validate release version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/validate_version.py \
            --tag "$TAG_NAME" \
            --run-number "$RUN_NUMBER" \
            --metadata app/build/outputs/apk/debug/output-metadata.json

      - name: Stage release asset
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "Expected non-empty APK not found: $source_apk" >&2
            exit 1
          fi

          asset_path="wallcrawl-${TAG_NAME}-debug.apk"
          cp "$source_apk" "$asset_path"
          printf 'ASSET_PATH=%s\n' "$asset_path" >> "$GITHUB_ENV"

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          > [!WARNING]
          > This is an early debug build. Uninstall any previous CI-distributed
          > WallCrawl build before installing this APK. Uninstalling removes the
          > app's local data.
          EOF

          gh release create "$TAG_NAME" \
            "$ASSET_PATH#WallCrawl ${TAG_NAME} debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WallCrawl ${TAG_NAME}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "$notes_file"
