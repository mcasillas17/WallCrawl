name: Release debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run tests, lint, and debug build
        run: ./gradlew test lint assembleDebug --stacktrace --no-daemon

      - name: Stage release asset
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if (( ${#TAG_NAME} > 128 )) || [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Unsupported release tag" >&2
            exit 1
          fi

          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "Expected non-empty APK not found: $source_apk" >&2
            exit 1
          fi

          asset_path="wallcrawl-${TAG_NAME}-debug.apk"
          cp "$source_apk" "$asset_path"
          printf 'ASSET_PATH=%s\n' "$asset_path" >> "$GITHUB_ENV"

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          > [!WARNING]
          > This is an early debug build. Uninstall any previous CI-distributed
          > WallCrawl build before installing this APK. Uninstalling removes the
          > app's local data.
          EOF

          gh release create "$TAG_NAME" \
            "$ASSET_PATH#WallCrawl ${TAG_NAME} debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WallCrawl ${TAG_NAME}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "$notes_file"
