name: Release debug APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Run release tooling tests
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Derive release version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/validate_version.py \
            --tag "$TAG_NAME" \
            --run-number "$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run tests, lint, and debug build
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew test lint assembleDebug \
            "-Pwallcrawl.versionCode=$VERSION_CODE" \
            "-Pwallcrawl.versionName=$VERSION_NAME" \
            --stacktrace \
            --no-daemon

      - name: Validate release version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/validate_version.py \
            --tag "$TAG_NAME" \
            --run-number "$RUN_NUMBER" \
            --metadata app/build/outputs/apk/debug/output-metadata.json

      - name: Stage release asset
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$source_apk" ]]; then
            echo "Expected non-empty APK not found: $source_apk" >&2
            exit 1
          fi

          asset_path="wallcrawl-${TAG_NAME}-debug.apk"
          cp "$source_apk" "$asset_path"
          printf 'ASSET_PATH=%s\n' "$asset_path" >> "$GITHUB_ENV"

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'EOF'
          > [!WARNING]
          > This is an early debug build. Uninstall any previous CI-distributed
          > WallCrawl build before installing this APK. Uninstalling removes the
          > app's local data.
          EOF

          gh release create "$TAG_NAME" \
            "$ASSET_PATH#WallCrawl ${TAG_NAME} debug APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WallCrawl ${TAG_NAME}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --notes-file "$notes_file"
