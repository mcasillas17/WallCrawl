name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Checks, unit tests and lint run as separate jobs so they finish in parallel
  # instead of one after another.
  checks:
    name: Catalog, tooling, and schema checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Check catalog against pinned upstream source
        run: python3 tools/workout-guide/check_pinned_catalog.py

      # Guards the reviewed programming metadata and the importer itself. Both suites
      # build their own fixtures, so they need nothing beyond Python and git, and they
      # run first so a bad metadata edit fails in seconds rather than after the build.
      - name: Run catalog importer tests
        run: python3 -m unittest discover -s tools/workout-guide -p 'test_*.py' -v

      - name: Validate research, authored catalog, and shipped illustrations
        run: |
          python3 tools/workout-guide/validate_condition_research.py --require-complete
          python3 tools/workout-guide/build_condition_reference.py --check
          python3 tools/workout-guide/build_movement_review.py --check
          python3 tools/workout-guide/validate_catalog_supplement.py
          python3 tools/workout-guide/package_illustrations.py --check-bundled

      - name: Run release tooling tests
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Check Room schema artifacts
        run: |
          python3 -m unittest discover -s tools/room -p 'test_*.py' -v
          python3 tools/room/check_schemas.py

  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Run unit tests and debug build
        run: ./gradlew test assembleDebug --stacktrace --no-daemon

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Run lint
        run: ./gradlew lint --stacktrace --no-daemon

  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The matrix and its limits are explained in docs/android-target-sdk-37.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full suite runs on 36 and 37 split in four parts, one emulator each, so
          # the slowest leg takes about a quarter as long. AndroidJUnitRunner assigns every
          # test to exactly one shard, so the four parts together are the whole suite.
          # Regression baseline the suite has always run on.
          - api-level: "36"
            shard: "1/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=0"
          - api-level: "36"
            shard: "2/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=1"
          - api-level: "36"
            shard: "3/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=2"
          - api-level: "36"
            shard: "4/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=3"
          # targetSdk. Android 17's SDK packages are versioned 37.0, not 37.
          - api-level: "37.0"
            shard: "1/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=0"
          - api-level: "37.0"
            shard: "2/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=1"
          - api-level: "37.0"
            shard: "3/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=2"
          - api-level: "37.0"
            shard: "4/4"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex=3"
          # minSdk boundary: only the app-level suites (installed SDK levels, packaged
          # backup rules, launcher icon, and real navigation, Back, recreation and
          # restore), so the matrix stays bounded. A package, not a class list: AGP keeps
          # only the first class of a comma-separated `class` argument.
          - api-level: "26"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.package=wallcrawl.elopenmike.com.app"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Build both APKs before the emulator starts, so compiling does not compete with a
      # running emulator for the runner's CPUs. The connected test task then finds them
      # up to date.
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Locate Android SDK
        id: sdk
        run: echo "dir=${ANDROID_HOME:?}" >> "$GITHUB_OUTPUT"

      # The system image is the biggest download (40 s to two minutes for 37.0). The
      # emulator action's sdkmanager install finds it already present and skips it.
      # Only main saves images: the three are about 4.8 GB, so a copy per pull request
      # would overflow the repository's 10 GB cache and evict the Gradle cache. Pull
      # requests read main's copy. Bump the key's trailing version to force a fresh download.
      - name: Restore emulator system image
        id: system-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.dir }}/system-images/android-${{ matrix.api-level }}/google_apis/x86_64
          key: system-image-${{ runner.os }}-android-${{ matrix.api-level }}-google_apis-x86_64-v1

      # The emulator needs hardware acceleration to finish in a sane time, and the
      # hosted runner does not grant access to /dev/kvm by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner's preinstalled command-line tools (12.0) write `target=android-0` into
      # an AVD for a dotted API level such as 37.0, so the emulator skips the RAM and
      # Vulkan setup Android 17 needs and the image never finishes booting. The emulator
      # action keeps a preinstalled copy, so replace it before the action creates the AVD.
      # https://github.com/ReactiveCircus/android-emulator-runner/issues/482 (open fix: #494)
      - name: Update Android command-line tools
        if: contains(matrix.api-level, '.')
        run: |
          sdk="${ANDROID_HOME:?}"
          # Accepting licenses first keeps the install outside a `yes` pipeline, so its exit
          # status is checked even under pipefail.
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;23.0"
          rm -rf "$sdk/cmdline-tools/latest"
          mv "$sdk/cmdline-tools/23.0" "$sdk/cmdline-tools/latest"
          grep -qx 'Pkg.Revision=23.0' "$sdk/cmdline-tools/latest/source.properties"

      # Room migrations from every supported starting schema to the current version,
      # exported-schema validation, and the weekly ledger DAO/repository are
      # only covered here: the JVM suite cannot run Room's real migration or its runtime
      # schema validation. Without this job a Room, AGP, or Gradle bump can pass every
      # other check while leaving the migration chain broken.
      # AGP's connected-test runner can log an APK install failure and still exit 0
      # without a report, so a leg passes only if its report recorded at least one test.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          INSTRUMENTATION_ARGS: ${{ matrix.instrumentation-args }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest $INSTRUMENTATION_ARGS --stacktrace --no-daemon
            grep -q 'tests="[1-9]' app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
            python3 tools/ci/instrumentation_summary.py

      - name: Save emulator system image
        if: github.ref == 'refs/heads/main' && steps.system-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.dir }}/system-images/android-${{ matrix.api-level }}/google_apis/x86_64
          key: ${{ steps.system-image.outputs.cache-primary-key }}

      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-report-api-${{ matrix.api-level }}${{ matrix.shard && format('-shard-{0}', strategy.job-index) || '' }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7
