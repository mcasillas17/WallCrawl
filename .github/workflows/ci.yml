name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check catalog against pinned upstream source
        run: python3 tools/workout-guide/check_pinned_catalog.py

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Guards the reviewed programming metadata and the importer itself. Both suites
      # build their own fixtures, so they need nothing beyond Python and git, and they
      # run first so a bad metadata edit fails in seconds rather than after the build.
      - name: Run catalog importer tests
        run: python3 -m unittest discover -s tools/workout-guide -p 'test_*.py' -v

      - name: Run release tooling tests
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Run tests, lint, and debug build
        run: ./gradlew test lint assembleDebug --stacktrace --no-daemon

  instrumentation:
    name: Instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The matrix and its limits are explained in docs/android-target-sdk-37.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Regression baseline the suite has always run on.
          - api-level: "36"
            instrumentation-args: ""
          # targetSdk. Android 17's SDK packages are versioned 37.0, not 37.
          - api-level: "37.0"
            instrumentation-args: ""
          # minSdk boundary: only the app-level suites (installed SDK levels, packaged
          # backup rules, launcher icon, and real navigation, Back, recreation and
          # restore), so the matrix stays bounded. A package, not a class list: AGP keeps
          # only the first class of a comma-separated `class` argument.
          - api-level: "26"
            instrumentation-args: "-Pandroid.testInstrumentationRunnerArguments.package=wallcrawl.elopenmike.com.app"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The emulator needs hardware acceleration to finish in a sane time, and the
      # hosted runner does not grant access to /dev/kvm by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Room migrations, the schema-10 chain, and the weekly ledger DAO/repository are
      # only covered here: the JVM suite cannot run Room's real migration or its runtime
      # schema validation. Without this job a Room, AGP, or Gradle bump can pass every
      # other check while leaving the migration chain broken.
      # AGP's connected-test runner can log an APK install failure and still exit 0
      # without a report, so a leg passes only if its report recorded at least one test.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          INSTRUMENTATION_ARGS: ${{ matrix.instrumentation-args }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest $INSTRUMENTATION_ARGS --stacktrace --no-daemon
            grep -q 'tests="[1-9]' app/build/outputs/androidTest-results/connected/debug/TEST-*.xml

      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-report-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 7
