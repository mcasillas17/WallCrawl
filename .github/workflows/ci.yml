name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Guards the reviewed programming metadata and the importer itself. Both suites
      # build their own fixtures, so they need nothing beyond Python and git, and they
      # run first so a bad metadata edit fails in seconds rather than after the build.
      - name: Run catalog importer tests
        run: python3 -m unittest discover -s tools/workout-guide -p 'test_*.py' -v

      - name: Run tests, lint, and debug build
        run: ./gradlew test lint assembleDebug --stacktrace --no-daemon
